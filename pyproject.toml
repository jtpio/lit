[project]
name = "lit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anywidget",
    "bqplot",
    "ipycanvas",
    "ipylab>=1.0",
    "ipyleaflet",
    "ipywidgets>=8.1",
    "jupyterlab_miami_nights>=0.4.0",
    "jupyterlab-filesystem-access>=0.7.0",
    "jupyterlab>=4.6.0b1",
    "jupyterlab-open-url-parameter>=0.3.0",
    "jupyterlab-cursor-dark>=1.0.2",
    "jupyterlab-cursor-light>=1.0.2",
    "jupyterlite-ai>=0.18.0",
    "jupyterlite-core>=0.8.0b1",
    "jupyterlite-javascript-kernel>=0.4.0a4",
    "jupyterlite-pyodide-kernel>=0.8.0b0",
    "jupyterlite-p5-kernel>=0.4.0a2",
    "jupyterlite-echo-kernel>=0.4.0",
    "jupyterlite-terminal>=1.4.2a2",
    "jupyterlite-xeus>=4.5.3",
    "notebook>=7.6.0b1",
    "jupyterlab-cell-flash",
    "jupyterlab-fasta>=3,<4",
    "jupyterlab-geojson>=3,<4",
    "plotly>=6,<7",
    "jupyterlab-github>=4.0.0",
]

[tool.uv]
# Allow pre-releases only for packages that explicitly request them (the
# JupyterLab / Notebook / JupyterLite betas pinned above), keeping everything
# else on stable releases.
prerelease = "if-necessary-or-explicit"
# jupyterlite-xeus and jupyterlite-terminal still declare a metadata-only cap of
# jupyterlite-core <0.8.0 (their shipped extensions are unchanged by it). Override
# the cap to test against the 0.8.0 beta. Remove once both release versions that
# allow jupyterlite-core >=0.8 (upstream PRs in progress).
override-dependencies = [
    "jupyterlite-core>=0.8.0b1,<0.9",
]
